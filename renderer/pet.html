<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桌面宠物</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: transparent;
      width: 100vw;
      height: 100vh;
      -webkit-app-region: no-drag;
      cursor: default;
      user-select: none;
    }

    #pet-canvas {
      width: 128px;
      height: 128px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: pointer;
    }

    /* 点击脉冲效果 */
    #pet-canvas.pulse {
      animation: pulse 0.3s ease;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    /* 爱心特效容器 */
    #particles-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
    }

    .heart-particle {
      position: absolute;
      font-size: 16px;
      animation: float-up 1s ease-out forwards;
      pointer-events: none;
    }

    @keyframes float-up {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-60px) scale(0.5);
      }
    }

    /* 持久提醒气泡 */
    .persistent-bubble {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      min-width: 200px;
      max-width: 280px;
      z-index: 200;
      animation: bubble-in 0.3s ease;
    }

    .persistent-bubble.hidden {
      display: none;
    }

    .bubble-header {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      background: linear-gradient(135deg, #FF9800, #FF5722);
      color: white;
      border-radius: 12px 12px 0 0;
      font-size: 13px;
      font-weight: 600;
    }

    .bubble-close {
      margin-left: auto;
      background: none;
      border: none;
      color: white;
      font-size: 18px;
      cursor: pointer;
      padding: 0 4px;
    }

    .bubble-close:hover {
      opacity: 0.8;
    }

    .bubble-body {
      padding: 12px;
      font-size: 13px;
      color: #333;
      line-height: 1.6;
    }

    .bubble-arrow {
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 8px solid white;
    }

    @keyframes bubble-in {
      from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
  </style>
</head>
<body>
  <canvas id="pet-canvas" width="128" height="128"></canvas>
  <div id="particles-container"></div>

  <!-- 持久提醒气泡 -->
  <div id="persistent-bubble" class="persistent-bubble hidden">
    <div class="bubble-header">
      <span class="bubble-icon">⏰</span>
      <span class="bubble-title">会议提醒</span>
      <button class="bubble-close" id="bubble-close">×</button>
    </div>
    <div class="bubble-body" id="bubble-body"></div>
    <div class="bubble-arrow"></div>
  </div>

  <script src="sprite-generator.js"></script>
  <script src="pet-animator.js"></script>
  <script src="mood-system.js"></script>
  <script src="dialogue-manager.js"></script>
  <script>
    // ========== 初始化桌面宠物系统 ==========

    const canvas = document.getElementById('pet-canvas');
    const particlesContainer = document.getElementById('particles-container');

    // 初始化动画系统
    const animator = new PetAnimator(canvas);

    // 初始化心情系统
    const moodSystem = new MoodSystem();

    // 初始化对话管理器
    const dialogueManager = new DialogueManager(animator, moodSystem);

    // ========== 闲逛系统 ==========

    let petX = 0;
    let petY = 0;
    let screenWidth = 0;
    let screenHeight = 0;
    let moveSpeed = 0.8;
    let moveDirection = 1; // 1=右, -1=左
    let isMoving = false;
    let stateTimer = 0;
    let moveDuration = 0;
    let idleDuration = 0;
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let petStartX = 0;
    let petStartY = 0;

    // 获取屏幕尺寸并初始化位置
    async function initScreen() {
      if (window.electronAPI) {
        const size = await window.electronAPI.getScreenSize();
        screenWidth = size.width;
        screenHeight = size.height;

        // 初始位置：屏幕底部中央
        petX = Math.round(screenWidth / 2 - 64);
        petY = Math.round(screenHeight - 128 - 50);

        updateWindowPosition();
        scheduleNextAction();
      }
    }

    // 更新窗口位置
    function updateWindowPosition() {
      if (window.electronAPI) {
        window.electronAPI.setWindowPosition(Math.round(petX), Math.round(petY));
      }
    }

    // 调度下一个动作
    function scheduleNextAction() {
      const action = Math.random() > 0.4 ? 'move' : 'idle';

      if (action === 'move') {
        isMoving = true;
        moveDuration = 3000 + Math.random() * 5000;
        moveDirection = Math.random() > 0.5 ? 1 : -1;
        animator.setState('walk');
        animator.direction = moveDirection;
      } else {
        isMoving = false;
        idleDuration = 2000 + Math.random() * 4000;
        animator.setState('idle');
      }

      stateTimer = 0;
    }

    // 更新闲逛位置
    function updateRoaming() {
      stateTimer += 16; // ~60fps

      if (!isDragging && isMoving) {
        petX += moveSpeed * moveDirection;

        // 边界检测
        if (petX <= 0) {
          petX = 0;
          moveDirection = 1;
          animator.direction = 1;
        } else if (petX >= screenWidth - 128) {
          petX = screenWidth - 128;
          moveDirection = -1;
          animator.direction = -1;
        }

        updateWindowPosition();

        if (stateTimer >= moveDuration) {
          scheduleNextAction();
        }
      } else if (!isDragging && !isMoving) {
        if (stateTimer >= idleDuration) {
          scheduleNextAction();
        }
      }

      requestAnimationFrame(updateRoaming);
    }

    // ========== 交互系统 ==========

    // 点击互动
    canvas.addEventListener('click', (e) => {
      if (isDragging) return;

      const rect = canvas.getBoundingClientRect();
      const y = e.clientY - rect.top;

      // 摸头区域（上方1/3）
      if (y < rect.height / 3) {
        onPetHead();
      } else {
        onPetBody();
      }
    });

    // 双击打开对话
    canvas.addEventListener('dblclick', (e) => {
      e.preventDefault();
      if (window.electronAPI) {
        window.electronAPI.openChat();
      }
    });

    // 右键菜单
    canvas.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      if (window.electronAPI) {
        window.electronAPI.showContextMenu(e.clientX, e.clientY);
      }
    });

    // 摸头互动
    function onPetHead() {
      moodSystem.addMood(10);
      animator.setState('happy');
      dialogueManager.triggerDialogue('interaction');
      emitHeartParticles();
      canvas.classList.add('pulse');
      setTimeout(() => canvas.classList.remove('pulse'), 300);
    }

    // 拍身体互动
    function onPetBody() {
      moodSystem.addMood(5);
      animator.setState('surprised');
      animator.showBubble('哎呀！');
      canvas.classList.add('pulse');
      setTimeout(() => canvas.classList.remove('pulse'), 300);
    }

    // 发射爱心粒子
    function emitHeartParticles() {
      for (let i = 0; i < 5; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart-particle';
        heart.textContent = '♥';
        heart.style.left = (64 + (Math.random() - 0.5) * 40) + 'px';
        heart.style.top = '20px';
        heart.style.color = '#FF6B9D';
        heart.style.animationDelay = (i * 0.1) + 's';
        particlesContainer.appendChild(heart);

        setTimeout(() => heart.remove(), 1000);
      }
    }

    // ========== 拖拽功能 ==========

    canvas.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return; // 只响应左键

      isDragging = true;
      dragStartX = e.screenX;
      dragStartY = e.screenY;
      petStartX = petX;
      petStartY = petY;

      canvas.style.cursor = 'grabbing';
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;

      const deltaX = e.screenX - dragStartX;
      const deltaY = e.screenY - dragStartY;

      petX = petStartX + deltaX;
      petY = petStartY + deltaY;

      // 边界限制
      petX = Math.max(0, Math.min(petX, screenWidth - 128));
      petY = Math.max(0, Math.min(petY, screenHeight - 128));

      updateWindowPosition();
    });

    document.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        canvas.style.cursor = 'pointer';
      }
    });

    // ========== 监听主进程动作 ==========

    if (window.electronAPI) {
      window.electronAPI.onPetAction((action) => {
        switch (action) {
          case 'pet-head':
            onPetHead();
            break;
          case 'feed':
            moodSystem.addMood(20);
            animator.setState('happy');
            animator.showBubble('好好吃~');
            emitHeartParticles();
            break;
        }
      });

      // ========== 监听日历提醒 ==========

      // 监听日历提醒事件
      window.electronAPI.onCalendarReminder((data) => {
        console.log('收到日历提醒:', data);
        // 显示气泡消息
        animator.showBubble(data.message, 8000);
        // 切换到开心状态
        animator.setState('happy');
        setTimeout(() => {
          animator.setState('idle');
        }, 3000);
      });

      // 监听日历气泡消息
      window.electronAPI.onCalendarBubble((data) => {
        console.log('收到日历气泡:', data);
        animator.showBubble(data.message, data.duration || 5000);
      });

      // ========== 监听持久提醒 ==========
      if (window.electronAPI.onShowPersistentBubble) {
        window.electronAPI.onShowPersistentBubble((data) => {
          console.log('📥 收到持久提醒 IPC:', data);
          const bubble = document.getElementById('persistent-bubble');
          console.log('📥 persistent-bubble 元素:', bubble);
          showPersistentBubble(data.title, data.content, data.type, data.eventId);
        });
      } else {
        console.log('⚠️ onShowPersistentBubble 未定义');
      }

      // 监听隐藏持久提醒
      if (window.electronAPI.onHidePersistentBubble) {
        window.electronAPI.onHidePersistentBubble(() => {
          console.log('隐藏持久提醒');
          hidePersistentBubble();
        });
      }
    }

    // ========== 持久提醒气泡 ==========

    /**
     * 显示持久提醒气泡
     * @param {string} title - 标题
     * @param {string} content - HTML 内容
     * @param {string} type - 类型
     * @param {string} eventId - 事件ID（用于关闭时通知主进程）
     */
    function showPersistentBubble(title, content, type = 'reminder', eventId = null) {
      console.log('🎨 showPersistentBubble 被调用:', { title, content, type, eventId });
      const bubble = document.getElementById('persistent-bubble');

      if (!bubble) {
        console.log('❌ persistent-bubble 元素不存在！');
        return;
      }

      // 存储 eventId 到 DOM 元素
      bubble.dataset.eventId = eventId || '';

      const icons = { reminder: '⏰', meeting: '📅', warning: '⚠️', info: 'ℹ️' };
      bubble.querySelector('.bubble-icon').textContent = icons[type] || '⏰';
      bubble.querySelector('.bubble-title').textContent = title;
      document.getElementById('bubble-body').innerHTML = content;

      bubble.classList.remove('hidden');
      console.log('✅ 泡泡已显示');

      // 调整窗口高度以显示泡泡（窗口向上扩展）
      if (window.electronAPI.resizePetWindow) {
        window.electronAPI.resizePetWindow(280);
      }
    }

    /**
     * 隐藏持久提醒气泡
     */
    function hidePersistentBubble() {
      const bubble = document.getElementById('persistent-bubble');
      if (bubble) {
        bubble.classList.add('hidden');
        bubble.dataset.eventId = '';
      }

      // 恢复窗口高度
      if (window.electronAPI.resizePetWindow) {
        window.electronAPI.resizePetWindow(128);
      }
    }

    // 绑定关闭按钮事件（点击关闭时通知主进程）
    document.getElementById('bubble-close').addEventListener('click', () => {
      const bubble = document.getElementById('persistent-bubble');
      const eventId = bubble?.dataset?.eventId;

      // 通知主进程用户手动关闭了提醒
      if (eventId && window.electronAPI.dismissReminder) {
        window.electronAPI.dismissReminder(eventId);
      }

      hidePersistentBubble();
    });

    // ========== 启动系统 ==========

    // 初始化屏幕
    initScreen();

    // 启动闲逛
    updateRoaming();

    // 启动时间问候
    setTimeout(() => {
      dialogueManager.triggerTimeGreeting();
    }, 3000);

    // 定期更新心情
    setInterval(() => {
      moodSystem.update(60000);
    }, 60000);

    console.log('桌面宠物系统已启动');
  </script>
</body>
</html>
